# DIME — nginx site (TLS via certbot: `certbot --nginx -d dime.rndm.io`).
# Static frontend from /opt/dime/app/out; API proxied from 127.0.0.1:8720 under /api.
# Pricing (8710) is exposed ONLY for /feed (read-only); keeper (8730) is not exposed.
limit_req_zone $binary_remote_addr zone=dime_api:10m rate=10r/s;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  server_name dime.rndm.io;
  root /opt/dime/app/out;
  client_max_body_size 32k;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  location /api/v1/stream {
    proxy_pass http://127.0.0.1:8720/v1/stream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }
  # Public read-only price feed (no proof, throttled). /debug and /internal are never proxied.
  location = /feed {
    proxy_pass http://127.0.0.1:8710/feed;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 3600s;
  }
  location ~ ^/feed/(health|history|metrics)$ {
    limit_req zone=dime_api burst=20 nodelay;
    proxy_pass http://127.0.0.1:8710;
  }
  location /api/ {
    limit_req zone=dime_api burst=20 nodelay;
    proxy_pass http://127.0.0.1:8720/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }
}
